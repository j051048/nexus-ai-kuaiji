name: Deploy PaddleOCR

on:
  push:
    branches: [main]
    paths:
      - 'services/paddle_ocr/**'
      - '.github/workflows/deploy-paddle.yml'
  workflow_dispatch:

concurrency:
  group: deploy-paddle
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deploy (paddle-ocr)
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          APP_UUID: w12vryzy0cntjt3fazyivohi
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "curl -sS -X POST 'http://127.0.0.1:8000/api/v1/deploy?uuid=$APP_UUID' -H 'Authorization: Bearer $COOLIFY_TOKEN'; echo"
