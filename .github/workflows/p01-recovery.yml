name: P01 joint recovery (PostgreSQL 16 and 17)
on: [push, pull_request]
permissions:
  contents: read
jobs:
  joint-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install test dependencies and both native PostgreSQL versions
        run: |
          python -m pip install -r nexus_backend/requirements.lock
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-17
      - name: Fetch pinned official test identity assets (no model or notification provider)
        id: assets
        run: python scripts/identity_test_assets.py fetch --directory "$RUNNER_TEMP/p01-gotrue"
      - name: Prepare owned isolated clusters and an immutable fresh run
        id: environment
        run: |
          set -euo pipefail
          python scripts/p01_local_recovery_env.py prepare --directory tmp_test/p01-ci-environment --runtime-base "$RUNNER_TEMP/p01-pg" --gotrue-root "$RUNNER_TEMP/p01-gotrue"
          python scripts/p01_local_recovery_env.py bootstrap --directory tmp_test/p01-ci-environment
          python scripts/p01_local_recovery_env.py new-pair --directory tmp_test/p01-ci-environment > tmp_test/p01-run-location.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          location = json.loads(Path('tmp_test/p01-run-location.json').read_text())['run_directory']
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('P01_RUN_DIRECTORY=' + location + '\n')
          PY
      - name: Start the authenticated local recovery bridge
        id: bridge
        run: python scripts/p01_local_recovery_env.py bridge-start --directory "$P01_RUN_DIRECTORY"
      - name: One candidate, all regressions and actual PG16/17 recovery, zero skips
        id: recovery
        run: >-
          python scripts/p01_recovery_gate.py --all
          --config-dir "$P01_RUN_DIRECTORY"
          --out tmp_test/p01-ci-acceptance
          --phase-timeout 3600
      - name: PG16 and PG17 measured mixed workload and two-process batch workers
        id: qa_validation
        run: |
          set -euo pipefail
          for major in 16 17; do
            python tools/capacity/qa_mixed.py --config "$P01_RUN_DIRECTORY/pg$major-recovery_source.json" --major "$major" --out "tmp_test/p01-ci-acceptance/reports/capacity-$major" --companies 200 --rounds 2
            python scripts/test_accounting_postgres_isolated.py --config "$P01_RUN_DIRECTORY/pg$major-recovery_source.json" nexus_backend/tests/test_qa05_admission_postgres.py nexus_backend/tests/test_batch1_database_pool_postgres.py nexus_backend/tests/test_ak05_unified_postgres.py nexus_backend/tests/test_queue_fairness_postgres.py nexus_backend/tests/test_model_cost_postgres_workflow.py nexus_backend/tests/test_ak01_postgres.py -p scripts.qa_no_skip -q --junitxml="tmp_test/p01-ci-acceptance/reports/qa-pg$major.xml"
          done
      - name: NEXT signed callback PG16/17 scope and concurrent replay, zero skips
        run: |
          set -euo pipefail
          for major in 16 17; do
            python scripts/test_accounting_postgres_isolated.py --config "$P01_RUN_DIRECTORY/pg$major-recovery_source.json" nexus_backend/tests/test_next_p0_receipts_postgres.py -p scripts.qa_no_skip -q --junitxml="tmp_test/p01-ci-acceptance/reports/next-receipts-pg$major.xml"
          done
      - name: Message privacy and business preparation on PG16 and PG17, zero skips
        run: |
          set -euo pipefail
          for major in 16 17; do
            python scripts/test_accounting_postgres_isolated.py --config "$P01_RUN_DIRECTORY/pg$major-recovery_source.json" nexus_backend/tests/test_ux01_03_postgres.py -p scripts.qa_no_skip -q --junitxml="tmp_test/p01-ci-acceptance/reports/ux01-03-pg$major.xml"
          done
      - name: Real PG and signed-identity browser journey, exact eight cases
        run: python scripts/p02_browser_gate.py --config-dir "$P01_RUN_DIRECTORY" --out tmp_test/p02-ci-browser
      - name: Stop only this run's bridge and owned clusters, retain data
        id: cleanup
        if: always()
        run: |
          result=0
          if [ -n "${P01_RUN_DIRECTORY:-}" ]; then
            python scripts/p01_local_recovery_env.py bridge-stop --directory "$P01_RUN_DIRECTORY" || result=1
          fi
          if [ -f tmp_test/p01-ci-environment/environment-private.json ]; then
            python scripts/p01_local_recovery_env.py stop --directory tmp_test/p01-ci-environment || result=1
            python scripts/p01_local_recovery_env.py status --directory tmp_test/p01-ci-environment || result=1
          fi
          exit "$result"
      - name: Preserve a public diagnostic when setup or cleanup prevents acceptance
        if: failure()
        env:
          ASSETS_OUTCOME: ${{ steps.assets.outcome }}
          ENVIRONMENT_OUTCOME: ${{ steps.environment.outcome }}
          BRIDGE_OUTCOME: ${{ steps.bridge.outcome }}
          RECOVERY_OUTCOME: ${{ steps.recovery.outcome }}
          QA_VALIDATION_OUTCOME: ${{ steps.qa_validation.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: |
          phase=dependencies
          for item in assets environment bridge recovery qa_validation cleanup; do
            variable="${item^^}_OUTCOME"
            if [ "${!variable}" = failure ]; then phase="$item"; break; fi
          done
          python scripts/qa_diagnostics.py --phase "$phase" --out tmp_test/p01-ci-acceptance/reports/ci-failure.json
      - name: Upload only sanitized machine-produced acceptance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-joint-recovery-evidence
          path: |
            tmp_test/p01-ci-acceptance/reports/**/*.json
            tmp_test/p01-ci-acceptance/reports/qa-pg*.xml
            tmp_test/p01-ci-acceptance/reports/next-receipts-pg*.xml
            tmp_test/p01-ci-acceptance/reports/ux01-03-pg*.xml
            tmp_test/p02-ci-browser/summary.json
          if-no-files-found: error
