name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'nexus_backend/**'
      - 'run_accounting_service.py'
      - 'Dockerfile'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deploys (api / worker / assistant / migration)
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          APPS="bugglqxqmyoph5rf1bhcqr7y bqy1rhxtnopwvfntik2aosi3 wif8r9srjkydpouwdi3uigat d9pthzniwgeajhvlhqg9swyz"
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "set -e
            for u in $APPS; do
              echo \"trigger \$u\"
              curl -sS -X POST \"http://127.0.0.1:8000/api/v1/deploy?uuid=\$u\" \
                -H 'Authorization: Bearer $COOLIFY_TOKEN' >/dev/null
            done
            echo 'all backend deploys queued'"
