name: Accounting foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ACCOUNTING_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/accounting_test
      ACCOUNTING_RUNTIME_PASSWORD: accounting-ci-only-password
      ACCOUNTING_WORKER_PASSWORD: accounting-ci-worker-only-password
      ACCOUNTING_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/accounting_test
      ACCOUNTING_TEST_DATABASE_URL: postgresql://accounting_ci:accounting-ci-only-password@127.0.0.1:5432/accounting_test
      ACCOUNTING_TEST_WORKER_DATABASE_URL: postgresql://accounting_ci_worker:accounting-ci-worker-only-password@127.0.0.1:5432/accounting_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Build the filtered Vercel upload and reject missing dependencies
        run: npm run test:vercel-build
      - run: npm run format:check
      - run: npm run lint
      - run: python -m pip install -r nexus_backend/requirements.lock
      - run: python scripts/env_doctor.py
      - run: python -m ruff check nexus_backend/app services/api_gateway scripts
      - run: python -m ruff format --check nexus_backend/app services/api_gateway scripts
      - run: python scripts/check_migration_idempotency.py
      - run: python scripts/migrate_accounting.py migrate
      - run: python scripts/migrate_accounting.py status --strict
      - run: python scripts/migrate_accounting.py provision-login --username accounting_ci
      - run: python scripts/migrate_accounting.py provision-worker-login --username accounting_ci_worker
      - run: python scripts/check_pg_test_target.py
      - run: npm test
      - run: npm run build
      - run: python -m pytest nexus_backend/tests -q

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: python -m pip install -r nexus_backend/requirements.lock
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/4

  core-regression-gate:
    name: V07–V10 same-candidate dev and preview gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: python -m pip install -r nexus_backend/requirements.lock
      - run: npx playwright install --with-deps chromium
      - name: Reject incomplete or misleading acceptance reports
        run: npm run test:e2e:gate
      - name: Frozen 106 cases against dev and fresh preview, no retries
        run: npm run test:e2e:core
      - name: Retain only whitelisted acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v10-core-regression-evidence
          path: test-reports/e2e-core/*/reports/*.json
          if-no-files-found: error

  ak05-postgres-gate:
    name: AK05 PostgreSQL ${{ matrix.postgres }} required gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 17]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ak05-ephemeral-ci-admin-only
          POSTGRES_DB: ak01_local_ak05_bootstrap
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ak01_local_ak05_bootstrap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r nexus_backend/requirements.lock
      - name: Gate negative tests
        run: python -m pytest nexus_backend/tests/test_ak05_postgres_gate.py nexus_backend/tests/test_c01_postgres_gate.py nexus_backend/tests/test_review_policy_pg_gate.py -q
      - name: Write local bootstrap config without logging credentials
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          folder = Path('tmp_test/ak05-ci-bootstrap')
          folder.mkdir(parents=True, exist_ok=True)
          path = folder / 'admin.json'
          path.write_text(json.dumps({'admin': 'postgresql://postgres:ak05-ephemeral-ci-admin-only@127.0.0.1:55432/ak01_local_ak05_bootstrap'}))
          path.chmod(0o600)
          PY
      - name: Prepare four fresh migrated databases and restricted logins
        run: >-
          python scripts/ak05_postgres_gate.py prepare
          --admin-config tmp_test/ak05-ci-bootstrap/admin.json
          --major ${{ matrix.postgres }}
          --out tmp_test/ak05-ci-config
          --allow-create-local-databases
      - name: Run frozen AK05 suites and verify every JUnit identity
        run: >-
          python scripts/ak05_postgres_gate.py run
          --manifest tmp_test/ak05-ci-config/manifest.json
          --out tmp_test/ak05-ci-reports
      - name: Monthly delivery and prerequisite regressions, no skips
        run: |
          python scripts/test_accounting_postgres_isolated.py --config tmp_test/ak05-ci-config/regression.json nexus_backend/tests/test_monthly_delivery_postgres.py nexus_backend/tests/test_monthly_delivery_prerequisite_postgres.py -q --junitxml=tmp_test/ak05-ci-reports/monthly-delivery.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('tmp_test/ak05-ci-reports/monthly-delivery.xml').getroot()
          expected = {
              'test_pg_freeze_download_and_independent_exact_hash_acknowledgement',
              'test_pg_package_roles_are_append_only_and_hash_guarded',
              'test_pg_customer_cannot_self_ack_or_forge_hash_and_revocation_is_current',
              'test_pg_read_only_client_can_ack_despite_staff_only_service_plan_rls',
              'test_pg_first_not_applicable_declaration_is_accepted_with_no_supersedes',
              'test_pg_native_replacement_reference_accepts_same_ledger',
              'test_pg_native_replacement_reference_rejects_other_company_ledger',
          }
          cases = root.findall('.//testcase')
          assert len(cases) == len(expected) and {case.attrib['name'] for case in cases} == expected
          assert all(not any(case.find(tag) is not None for tag in ('skipped', 'failure', 'error')) for case in cases)
          PY
      - name: Independent C01 exact identity and concurrency gate
        run: >-
          python scripts/c01_postgres_gate.py
          --config tmp_test/ak05-ci-config/regression.json
          --out tmp_test/ak05-ci-reports/c01
      - name: Independent review policy exact identity and concurrency gate
        run: >-
          python scripts/review_policy_postgres_gate.py
          --config tmp_test/ak05-ci-config/regression.json
          --out tmp_test/ak05-ci-reports/review-policy
      - name: Independent logical version exact identity gate
        run: >-
          python scripts/review_policy_postgres_gate.py
          --suite logical
          --config tmp_test/ak05-ci-config/regression.json
          --out tmp_test/ak05-ci-reports/logical-version
      - name: Retain only sanitized gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ak05-postgres-${{ matrix.postgres }}-evidence
          path: tmp_test/ak05-ci-reports/
          if-no-files-found: warn
