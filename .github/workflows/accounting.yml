name: Accounting foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ACCOUNTING_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/accounting_test
      ACCOUNTING_RUNTIME_PASSWORD: accounting-ci-only-password
      ACCOUNTING_WORKER_PASSWORD: accounting-ci-worker-only-password
      ACCOUNTING_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/accounting_test
      ACCOUNTING_TEST_DATABASE_URL: postgresql://accounting_ci:accounting-ci-only-password@127.0.0.1:5432/accounting_test
      ACCOUNTING_TEST_WORKER_DATABASE_URL: postgresql://accounting_ci_worker:accounting-ci-worker-only-password@127.0.0.1:5432/accounting_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Build the filtered Vercel upload and reject missing dependencies
        run: npm run test:vercel-build
      - run: npm run format:check
      - run: npm run lint
      - run: python -m pip install -r nexus_backend/requirements.lock
      - run: python scripts/env_doctor.py
      - run: python -m ruff check nexus_backend/app services/api_gateway scripts
      - run: python -m ruff format --check nexus_backend/app services/api_gateway scripts
      - run: python scripts/check_migration_idempotency.py
      - run: python scripts/migrate_accounting.py migrate
      - run: python scripts/migrate_accounting.py status --strict
      - run: python scripts/migrate_accounting.py provision-login --username accounting_ci
      - run: python scripts/migrate_accounting.py provision-worker-login --username accounting_ci_worker
      - run: python scripts/check_pg_test_target.py
      - run: npm test
      - run: npm run build
      # These suites require the four-role, non-default-port isolation contract.
      # They run below on BOTH PG16/17, with exact identities and zero skips.
      - run: >-
          python -m pytest nexus_backend/tests -q
          --ignore=nexus_backend/tests/test_tax_workpaper_postgres.py
          --ignore=nexus_backend/tests/test_n02_tax_concurrency_postgres.py
          --ignore=nexus_backend/tests/test_n03_notification_postgres.py
          --ignore=nexus_backend/tests/test_n03_worker_postgres.py

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: python -m pip install -r nexus_backend/requirements.lock
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/4

  core-regression-gate:
    name: V07–V10 same-candidate dev and preview gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: python -m pip install -r nexus_backend/requirements.lock
      - run: npx playwright install --with-deps chromium
      - name: Reject incomplete or misleading acceptance reports
        run: npm run test:e2e:gate
      - name: Frozen 106 cases against dev and fresh preview, no retries
        run: npm run test:e2e:core
      - name: Retain only whitelisted acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v10-core-regression-evidence
          path: test-reports/e2e-core/*/reports/*.json
          if-no-files-found: error

  ak05-postgres-gate:
    name: AK05 PostgreSQL ${{ matrix.postgres }} required gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 17]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ak05-ephemeral-ci-admin-only
          POSTGRES_DB: ak01_local_ak05_bootstrap
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ak01_local_ak05_bootstrap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r nexus_backend/requirements.lock
      - name: Gate negative tests
        run: python -m pytest nexus_backend/tests/test_ak05_postgres_gate.py nexus_backend/tests/test_c01_postgres_gate.py nexus_backend/tests/test_review_policy_pg_gate.py -q
      - name: Write local bootstrap config without logging credentials
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          folder = Path('tmp_test/ak05-ci-bootstrap')
          folder.mkdir(parents=True, exist_ok=True)
          path = folder / 'admin.json'
          path.write_text(json.dumps({'admin': 'postgresql://postgres:ak05-ephemeral-ci-admin-only@127.0.0.1:55432/ak01_local_ak05_bootstrap'}))
          path.chmod(0o600)
          PY
      - name: Prepare four fresh migrated databases and restricted logins
        run: >-
          python scripts/ak05_postgres_gate.py prepare
          --admin-config tmp_test/ak05-ci-bootstrap/admin.json
          --major ${{ matrix.postgres }}
          --out tmp_test/ak05-ci-config
          --allow-create-local-databases
      - name: Run frozen AK05 suites and verify every JUnit identity
        run: >-
          python scripts/ak05_postgres_gate.py run
          --manifest tmp_test/ak05-ci-config/manifest.json
          --out tmp_test/ak05-ci-reports
      - name: Monthly delivery and prerequisite regressions, no skips
        run: |
          python scripts/test_accounting_postgres_isolated.py --config tmp_test/ak05-ci-config/regression.json nexus_backend/tests/test_monthly_delivery_postgres.py nexus_backend/tests/test_monthly_delivery_prerequisite_postgres.py -q --junitxml=tmp_test/ak05-ci-reports/monthly-delivery.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('tmp_test/ak05-ci-reports/monthly-delivery.xml').getroot()
          expected = {
              'test_pg_freeze_download_and_independent_exact_hash_acknowledgement',
              'test_pg_package_roles_are_append_only_and_hash_guarded',
              'test_pg_customer_cannot_self_ack_or_forge_hash_and_revocation_is_current',
              'test_pg_read_only_client_can_ack_despite_staff_only_service_plan_rls',
              'test_pg_first_not_applicable_declaration_is_accepted_with_no_supersedes',
              'test_pg_native_replacement_reference_accepts_same_ledger',
              'test_pg_native_replacement_reference_rejects_other_company_ledger',
          }
          cases = root.findall('.//testcase')
          assert len(cases) == len(expected) and {case.attrib['name'] for case in cases} == expected
          assert all(not any(case.find(tag) is not None for tag in ('skipped', 'failure', 'error')) for case in cases)
          PY
      - name: Independent C01 exact identity and concurrency gate
        run: >-
          python scripts/c01_postgres_gate.py
          --config tmp_test/ak05-ci-config/regression.json
          --out tmp_test/ak05-ci-reports/c01
      - name: Independent review policy exact identity and concurrency gate
        run: >-
          python scripts/review_policy_postgres_gate.py
          --config tmp_test/ak05-ci-config/regression.json
          --out tmp_test/ak05-ci-reports/review-policy
      - name: Independent logical version exact identity gate
        run: >-
          python scripts/review_policy_postgres_gate.py
          --suite logical
          --config tmp_test/ak05-ci-config/regression.json
          --out tmp_test/ak05-ci-reports/logical-version
      - name: Historical compatibility forward repair, exact cases without skips
        run: |
          python scripts/test_accounting_postgres_isolated.py --config tmp_test/ak05-ci-config/regression.json nexus_backend/tests/test_historical_compatibility_postgres.py -q --junitxml=tmp_test/ak05-ci-reports/historical-compatibility.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          versions = (87, 138, 148, 149, 150)
          expected = {
              'test_pg_upgrade_repairs_once_preserving_history_under_two_migrators',
              'test_pg_strict_status_rejects_label_drift_with_all_migrations_present',
              'test_pg_reapplying_to_correct_metadata_is_a_true_noop',
              'test_pg_old_image_cannot_ignore_the_breaking_repair',
              *[f'test_pg_partial_metadata_drift_is_repaired_without_touching_other_rows[versions{i}]' for i in range(3)],
              *[f'test_pg_wrong_historical_checksum_aborts_whole_repair[{v}-{c}]' for v in versions for c in ('incremental', 'breaking')],
              *[f'test_pg_missing_historical_record_aborts_whole_repair[{v}]' for v in versions],
              *[f'test_pg_repair_is_unavailable_to_runtime_roles[{p}]' for p in ('app', 'worker')],
          }
          root = ET.parse('tmp_test/ak05-ci-reports/historical-compatibility.xml').getroot()
          cases = list(root.iter('testcase'))
          assert len(cases) == len(expected) == 24
          assert {c.get('name') for c in cases} == expected
          assert {c.get('classname') for c in cases} == {'nexus_backend.tests.test_historical_compatibility_postgres'}
          assert not any(list(root.iter(tag)) for tag in ('skipped', 'failure', 'error'))
          assert all(not int(n.get(k, '0')) for n in [root, *root.iter('testsuite')] for k in ('skipped', 'failures', 'errors', 'disabled', 'deselected'))
          PY
      - name: Retain only sanitized gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ak05-postgres-${{ matrix.postgres }}-evidence
          path: tmp_test/ak05-ci-reports/
          if-no-files-found: warn

  n02-n03-postgres-gate:
    name: N02/N03 PostgreSQL ${{ matrix.postgres }} required gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 17]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: n02-n03-ephemeral-ci-admin-only
          POSTGRES_DB: ak01_local_ak05_bootstrap
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ak01_local_ak05_bootstrap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r nexus_backend/requirements.lock
      - name: Negative tests for target, exact-case evidence and release preflight
        run: >-
          python -m pytest nexus_backend/tests/test_pg_suite_target.py
          nexus_backend/tests/test_n02_n03_postgres_gate.py
          nexus_backend/tests/test_n02_n03_ci_contract.py
          nexus_backend/tests/test_release_candidate.py -q
      - name: Write ephemeral local bootstrap configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          folder = Path('tmp_test/n02-n03-ci-bootstrap')
          folder.mkdir(parents=True, exist_ok=True)
          path = folder / 'admin.json'
          path.write_text(json.dumps({'admin': 'postgresql://postgres:n02-n03-ephemeral-ci-admin-only@127.0.0.1:55432/ak01_local_ak05_bootstrap'}))
          path.chmod(0o600)
          PY
      - name: Reuse isolated provisioning, separate from AK05/C01 data
        run: >-
          python scripts/ak05_postgres_gate.py prepare
          --admin-config tmp_test/n02-n03-ci-bootstrap/admin.json
          --major ${{ matrix.postgres }}
          --out tmp_test/n02-n03-ci-config
          --allow-create-local-databases
      - name: N02/N03 exact identities, real PG and no skipped cases
        run: >-
          python scripts/n02_n03_postgres_gate.py
          --config tmp_test/n02-n03-ci-config/regression.json
          --major ${{ matrix.postgres }}
          --out tmp_test/n02-n03-ci-reports
      - name: Retain sanitized N02/N03 evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n02-n03-postgres-${{ matrix.postgres }}-evidence
          path: tmp_test/n02-n03-ci-reports/
          if-no-files-found: error

  controlled-candidate-check:
    name: Same-candidate evidence check (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [verify, e2e, core-regression-gate, ak05-postgres-gate, n02-n03-postgres-gate]
    if: always()
    steps:
      - name: Require every predecessor including both PG matrices
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['REQUIRED_RESULTS'])
          if not results or any(result["result"] != "success" for result in results.values()):
              raise SystemExit('Candidate not ready: a required gate failed, was cancelled or skipped')
          PY
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: n02-n03-postgres-16-evidence
          path: tmp_test/candidate-evidence/pg16
      - uses: actions/download-artifact@v4
        with:
          name: n02-n03-postgres-17-evidence
          path: tmp_test/candidate-evidence/pg17
      - name: Independently verify exact cases, hashes and current candidate
        run: >-
          python scripts/check_release_candidate.py
          --mode technical
          --pg16 tmp_test/candidate-evidence/pg16
          --pg17 tmp_test/candidate-evidence/pg17
          --out tmp_test/candidate-evidence/technical-summary.json
      - name: Retain technical readiness evidence, never a deployment approval
        uses: actions/upload-artifact@v4
        with:
          name: controlled-candidate-technical-evidence
          path: tmp_test/candidate-evidence/technical-summary.json
          if-no-files-found: error
