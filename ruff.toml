target-version = "py311"
line-length = 100
extend-exclude = [".codex", "node_modules", "nexus_backend/migrations", ".agents", "artifacts"]

[lint]
# Start with executable correctness checks; broader style rules can follow by domain.
select = ["E9", "F63", "F7", "F82"]

[format]
quote-style = "double"
line-ending = "lf"
