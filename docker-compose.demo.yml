# Local reproduction of the cloud topology. Not a Zeabur deployment template.
# docker compose --env-file .env.demo.local -f docker-compose.demo.yml up --build
# All originals are in one private Supabase bucket; there is no shared disk.
x-service: &service
  image: nexus-accounting-demo:local
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  init: true
  stop_grace_period: 120s
  read_only: true
  tmpfs:
    - /tmp:uid=10001,gid=10001,mode=1770,size=128m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-common: &common
  ACCOUNTING_ENV: production
  ACCOUNTING_SEED: "0"
  ACCOUNTING_QUEUE_EMBEDDED_WORKER: "0"
  ACCOUNTING_STORAGE_BACKEND: supabase
  ACCOUNTING_STORAGE_SUPABASE_URL: ${ACCOUNTING_STORAGE_SUPABASE_URL:?set private storage project URL}
  ACCOUNTING_STORAGE_BUCKET: ${ACCOUNTING_STORAGE_BUCKET:?set private bucket name}
  ACCOUNTING_STORAGE_SERVER_KEY: ${ACCOUNTING_STORAGE_SERVER_KEY:?set backend-only storage key}
  ACCOUNTING_STORAGE_TIMEOUT_SECONDS: ${ACCOUNTING_STORAGE_TIMEOUT_SECONDS:-20}
  ACCOUNTING_STORAGE_ALLOW_HTTP: "false"

x-models: &models
  <<: *common
  ACCOUNTING_AI_BASE_URL: ${ACCOUNTING_AI_BASE_URL:-}
  ACCOUNTING_AI_API_KEY: ${ACCOUNTING_AI_API_KEY:-}
  ACCOUNTING_AI_VISION_MODEL: ${ACCOUNTING_AI_VISION_MODEL:-}
  ACCOUNTING_AI_OCR_BASE_URL: ${ACCOUNTING_AI_OCR_BASE_URL:-}
  ACCOUNTING_AI_OCR_API_KEY: ${ACCOUNTING_AI_OCR_API_KEY:-}
  ACCOUNTING_AI_OCR_MODEL: ${ACCOUNTING_AI_OCR_MODEL:-}
  ACCOUNTING_AI_JOURNAL_BASE_URL: ${ACCOUNTING_AI_JOURNAL_BASE_URL:-}
  ACCOUNTING_AI_JOURNAL_API_KEY: ${ACCOUNTING_AI_JOURNAL_API_KEY:-}
  ACCOUNTING_AI_JOURNAL_MODEL: ${ACCOUNTING_AI_JOURNAL_MODEL:-}
  ACCOUNTING_AI_CHAT_BASE_URL: ${ACCOUNTING_AI_CHAT_BASE_URL:-}
  ACCOUNTING_AI_CHAT_API_KEY: ${ACCOUNTING_AI_CHAT_API_KEY:-}
  ACCOUNTING_AI_CHAT_MODEL: ${ACCOUNTING_AI_CHAT_MODEL:-}
  ACCOUNTING_AI_RESPONSE_FORMAT: ${ACCOUNTING_AI_RESPONSE_FORMAT:-json_schema}
  ACCOUNTING_AI_OCR_RESPONSE_FORMAT: ${ACCOUNTING_AI_OCR_RESPONSE_FORMAT:-}
  ACCOUNTING_AI_JOURNAL_RESPONSE_FORMAT: ${ACCOUNTING_AI_JOURNAL_RESPONSE_FORMAT:-}
  ACCOUNTING_AI_CHAT_RESPONSE_FORMAT: ${ACCOUNTING_AI_CHAT_RESPONSE_FORMAT:-}
  ACCOUNTING_AI_TIMEOUT_SECONDS: ${ACCOUNTING_AI_TIMEOUT_SECONDS:-45}
  ACCOUNTING_AI_MAX_CONCURRENCY: "2"
  ACCOUNTING_AI_ALLOW_HTTP: "0"
  ACCOUNTING_AI_OCR_INPUT_CNY_PER_MILLION: ${ACCOUNTING_AI_OCR_INPUT_CNY_PER_MILLION:-}
  ACCOUNTING_AI_OCR_OUTPUT_CNY_PER_MILLION: ${ACCOUNTING_AI_OCR_OUTPUT_CNY_PER_MILLION:-}
  ACCOUNTING_AI_PROPOSAL_INPUT_CNY_PER_MILLION: ${ACCOUNTING_AI_PROPOSAL_INPUT_CNY_PER_MILLION:-}
  ACCOUNTING_AI_PROPOSAL_OUTPUT_CNY_PER_MILLION: ${ACCOUNTING_AI_PROPOSAL_OUTPUT_CNY_PER_MILLION:-}
  ACCOUNTING_AI_CHAT_INPUT_CNY_PER_MILLION: ${ACCOUNTING_AI_CHAT_INPUT_CNY_PER_MILLION:-}
  ACCOUNTING_AI_CHAT_OUTPUT_CNY_PER_MILLION: ${ACCOUNTING_AI_CHAT_OUTPUT_CNY_PER_MILLION:-}

services:
  api:
    <<: *service
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      <<: *models
      ACCOUNTING_SERVICE_ROLE: api
      PORT: "8080"
      ACCOUNTING_AUTH_MODE: supabase
      ACCOUNTING_DATABASE_URL: ${ACCOUNTING_DATABASE_URL:?set API restricted DSN}
      ACCOUNTING_SUPABASE_URL: ${ACCOUNTING_SUPABASE_URL:?set auth project URL}
      ACCOUNTING_SUPABASE_PUBLISHABLE_KEY: ${ACCOUNTING_SUPABASE_PUBLISHABLE_KEY:?set public auth key}
      ACCOUNTING_ALLOWED_HOSTS: ${ACCOUNTING_ALLOWED_HOSTS:?set backend host whitelist}
      ACCOUNTING_ALLOWED_ORIGINS: ${ACCOUNTING_ALLOWED_ORIGINS:?set HTTPS frontend origins}
  worker:
    <<: *service
    environment:
      <<: *models
      ACCOUNTING_SERVICE_ROLE: worker
      ACCOUNTING_WORKER_DATABASE_URL: ${ACCOUNTING_OCR_WORKER_DATABASE_URL:?set OCR restricted worker DSN}
      ACCOUNTING_QUEUE_CONCURRENCY: "2"
      ACCOUNTING_QUEUE_POLL_SECONDS: "1"
      ACCOUNTING_QUEUE_LEASE_SECONDS: "180"
  assistant:
    <<: *service
    environment:
      <<: *models
      ACCOUNTING_SERVICE_ROLE: assistant
      ACCOUNTING_WORKER_DATABASE_URL: ${ACCOUNTING_ASSISTANT_WORKER_DATABASE_URL:?set assistant restricted worker DSN}
  migration:
    <<: *service
    environment:
      <<: *common
      ACCOUNTING_SERVICE_ROLE: migration
      ACCOUNTING_WORKER_DATABASE_URL: ${ACCOUNTING_MIGRATION_WORKER_DATABASE_URL:?set migration restricted worker DSN}
      ACCOUNTING_MIGRATION_CONCURRENCY: "1"
